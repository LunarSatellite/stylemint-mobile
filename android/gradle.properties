org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Give the Kotlin compile daemon its own heap so it doesn't inherit the large org.gradle.jvmargs above (fixes daemon startup termination)
kotlin.daemon.jvmargs=-Xmx2G
# Kotlin's incremental compiler computes relative paths between the project dir and its
# cache/pub-cache dirs. When the project lives on a different drive letter than the Gradle/pub
# caches (e.g. project on D:, caches on C:), that relativization throws ("this and base files
# have different roots"), crashing the compile daemon for every KGP-applying plugin module.
# Disable incremental compilation to avoid it entirely.
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
